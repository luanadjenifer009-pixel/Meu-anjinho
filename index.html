let current = 0;
let selectedChoices = {};

const card = document.getElementById("card");
const nextBtn = document.getElementById("nextBtn");
const backBtn = document.getElementById("backBtn");

function renderSlide() {
  const slide = slides[current];

  card.style.animation = "none";
  void card.offsetWidth;
  card.style.animation = "appear .5s ease";

  let html = `
    <div class="emoji">${slide.emoji}</div>
    <h2>${slide.title}</h2>
    <p>${slide.text}</p>
  `;

  if (slide.choices) {
    html += `<div style="width:100%;margin-top:5px">`;

    slide.choices.forEach((choice, index) => {
      const selected = selectedChoices[current] === index
        ? "selected"
        : "";

      html += `
        <button class="choice ${selected}"
          onclick="selectChoice(${index})">
          ${choice}
        </button>
      `;
    });

    html += `</div>`;
  }

  if (current === 0) {
    html += `
      <div class="seal" onclick="nextSlide()"
        title="Abrir cartinha">💌</div>
    `;
  }

  card.innerHTML = html;

  backBtn.style.visibility = current === 0
    ? "hidden"
    : "visible";

  if (slide.restart) {
    nextBtn.textContent = "Recomeçar ❤️";
  } else if (slide.choices) {
    nextBtn.textContent = "Minha resposta 💗";
  } else {
    nextBtn.textContent = slide.button || "Continuar 💗";
  }

  document.getElementById("progressBar").style.width =
    ((current + 1) / slides.length * 100) + "%";

  document.getElementById("slideNumber").textContent =
    `Cartinha ${current + 1} de ${slides.length}`;

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function nextSlide() {
  const slide = slides[current];

  if (slide.restart) {
    current = 0;
    selectedChoices = {};
    renderSlide();
    return;
  }

  if (slide.choices && selectedChoices[current] === undefined) {
    showToast("Escolha uma resposta primeiro, meu amor 💗");
    return;
  }

  if (slide.choices) {
    const choice = slide.choices[selectedChoices[current]];
    showToast("Sua escolha: " + choice);
  }

  if (current < slides.length - 1) {
    current++;
    renderSlide();
    createBurst();
  }
}

function previousSlide() {
  if (current > 0) {
    current--;
    renderSlide();
  }
}

function selectChoice(index) {
  selectedChoices[current] = index;
  renderSlide();

  if (current === 6) {
    showToast("Resposta guardada neste site 💕");
  } else {
    showToast("Escolha feita com carinho ❤️");
  }
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2400);
}

function createHeart() {
  const container = document.getElementById("hearts");
  const heart = document.createElement("span");

  heart.className = "heart";
  heart.textContent = ["💗", "💕", "♡", "💖", "🌸"][
    Math.floor(Math.random() * 5)
  ];

  heart.style.left = Math.random() * 100 + "%";
  heart.style.fontSize = (12 + Math.random() * 20) + "px";
  heart.style.animationDuration = (7 + Math.random() * 7) + "s";

  container.appendChild(heart);

  setTimeout(() => heart.remove(), 15000);
}

function createBurst() {
  for (let i = 0; i < 12; i++) {
    setTimeout(createHeart, i * 70);
  }
}

setInterval(createHeart, 850);

renderSlide();
</script>
